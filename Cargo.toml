[package]
name = "packet_parser"
version = "11.8.1"
edition = "2024"
# MSRV verifiee en CI : let-chains et u{n}::is_multiple_of exigent 1.88.
rust-version = "1.88"
authors = ["Cyprien Avico avicocyprien@yahoo.com"]
description = "A powerful and modular Rust crate for network packet parsing."
license = "MIT"
repository = "https://github.com/Akmot9/Packet-parser"
categories = ["network-programming", "parsing", "development-tools"]
readme = "README.md"
homepage = "https://akmot9.github.io/packet-parser-book/"
documentation = "https://docs.rs/packet_parser"
keywords = ["network", "packets", "parser", "cybersecurity", "Rust"]
# Liste d'inclusion plutôt que d'exclusion : fail-closed par construction.
# Un `exclude` oublie tout nouveau fichier de travail (.DS_Store, notes de
# sprint, rapports d'audit) et l'embarque dans chaque release crates.io.
# Les motifs suivent la sémantique gitignore : un chemin non ancré matche a
# toute profondeur (`README.md` attraperait `pcaps_exemple/README.md`), d'ou
# le `/` initial sur les fichiers de racine.
include = [
    "/src/**",
    "/examples/**",
    "/images/packet_parser.png", # référencée par le README
    "/README.md",
    "/README-fr.md",
    "/CHANGELOG.md",
    # Le CHANGELOG de la 11.0.0 y renvoie a chaque rupture : sans lui, sept
    # references mortes pour qui lit la crate depuis crates.io.
    "/MIGRATION-11.md",
    "/LICENSE.md",
    # L'en-tete de rustdoc qui dessine les schemas mermaid : docs.rs construit
    # la doc depuis l'archive publiee, il doit donc y etre (#215).
    "/docs/rustdoc/mermaid.html",
]

# docs.rs dessine les schemas ```mermaid packet-beta de la doc (#215). En
# local : `cargo doc-mermaid` (alias de .cargo/config.toml).
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/rustdoc/mermaid.html"]


[dependencies]
thiserror = "2.0.18"
pcap-file = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.4", default-features = false, features = ["v4"] }
chrono = "0.4.45" # for ntp timestamp
hex = "0.4.3"

# Volontairement sans `pcap` ni `pnet` : leurs bindings natifs (libpcap,
# Npcap sur Windows) empechaient tests et exemples de compiler hors Linux.
# `pcap-file` (Rust pur) lit les captures partout, voir examples/scan_pcaps.rs.
[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.150"

[workspace]
# La crate est seule dans son workspace (#223). tools/lab : l'etabli (bench,
# ingestion, capture live), avec son propre workspace et son Cargo.lock ;
# verbench : Cargo.toml genere par run.sh ; fuzz : cargo-fuzz et nightly.
exclude = ["tools/lab", "tools/verbench", "fuzz"]

[profile.release]
opt-level = 3         # Highest speed optimization
lto = "fat"           # Link Time Optimization for best performance
codegen-units = 1     # Best for performance (slower build)
panic = "abort"       # Optional: slightly faster, smaller
strip = false         # Keep symbols if you want better profiling/debugging
incremental = false   # Ensures full optimization
debug = false         # No debug info in release
rpath = false         # No runtime path in binary

[features]
default = []
# Additive : l'API est la meme avec ou sans (voir src/timing/mod.rs).
parse_timing = []
