name: Cargo Deny

# Bloquant sur chaque push/PR (audit 8.1.0, issue #31) : une advisory ou une
# licence interdite doit empêcher la fusion, pas apparaître le lundi suivant.
# Le run hebdomadaire reste utile : la base RUSTSEC évolue sans commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Check Advisories, Licenses, Bans and Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check --hide-inclusion-graph
