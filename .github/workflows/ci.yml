name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Run Lint, Tests, Audit and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --workspace : la crate est seule dans son workspace depuis #223 ;
      # l'etabli (tools/lab) a le sien et son job `lab`, plus bas.
      # --all-features : la feature parse_timing duplique le pipeline ;
      # sans ce drapeau, cette moitié du code n'était jamais vérifiée.
      # --locked : Cargo.lock est versionné ; une dérive de dépendance doit
      # être un commit explicite, pas un effet de bord du runner.
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked --verbose

      - name: Security audit
        run: cargo install cargo-audit --locked && cargo audit

      - name: Build
        run: cargo build --release --all-features --locked

  # L'API publique de chaque PR et de main est comparee a la derniere version
  # publiee sur crates.io (#213). Le gate ne tournait qu'au tag
  # (publish.yml) : deux discriminants decales (`IpType::Broadcast` pendant
  # l'epic 11.0.0, `LinkLayerError::InvalidAddressFamily` sur #95) avaient
  # compile et passe tous les tests, et ne s'etaient vus qu'a la main.
  #
  # Entre deux releases, Cargo.toml repete la version publiee, puisque le
  # bump se fait dans la PR de release. L'outil supposerait alors un patch et
  # refuserait une simple depreciation : le job annonce une mineure, et seule
  # une rupture echoue. Des que Cargo.toml est bumpe, c'est le bump declare
  # qui compte : 11.9.0 refuse une rupture, 12.0.0 l'accepte. Une majeure
  # s'annonce donc dans Cargo.toml des la premiere PR qui casse. Le gate de
  # publish.yml garde le dernier mot : il compare le tag au bump reel.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read the latest published version
        id: baseline
        shell: bash
        run: |
          published=$(curl -sSfL --retry 3 \
            -A "packet_parser-ci (https://github.com/Akmot9/Packet-parser)" \
            https://crates.io/api/v1/crates/packet_parser \
            | jq -er '.crate.max_stable_version')
          current=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "packet_parser") | .version')
          echo "Cargo.toml : $current ; crates.io : $published"
          echo "version=$published" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$published" ]; then
            echo "release-type=minor" >> "$GITHUB_OUTPUT"
          fi

      # L'action telecharge le binaire precompile (pas de `cargo install`) et
      # met en cache le rustdoc de la baseline. Un `release-type` vide n'est
      # pas transmis : l'outil deduit alors le bump de Cargo.toml.
      - name: Check API compatibility against the published version
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: packet_parser
          baseline-version: ${{ steps.baseline.outputs.version }}
          release-type: ${{ steps.baseline.outputs.release-type }}
          rust-toolchain: manual

  # La MSRV declaree dans Cargo.toml (rust-version) doit rester vraie :
  # let-chains et is_multiple_of exigent 1.88. Seule la crate publiee est
  # verifiee — les membres du workspace ne sont pas publies.
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check with MSRV
        run: cargo check -p packet_parser --all-features --all-targets --locked

  # La crate publiee n'a aucune dependance systeme (pcap-file est du Rust
  # pur) : elle doit compiler et passer ses tests hors Linux. Pas de job
  # Windows, par decision : meme si la suite n'exige plus Npcap depuis le
  # retrait des dev-dependencies pcap/pnet, on ne veut aucune adherence a
  # cet ecosysteme (licence OEM). La suite reste portable — seul un
  # separateur de chemin a du etre normalise pour Windows.
  cross-os:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p packet_parser --all-features --all-targets --locked

  # `fuzz/` est exclu du workspace (il exige cargo-fuzz et nightly), donc rien
  # ne le compilait : les cibles pourrissaient en silence dès qu'une signature
  # publique changeait. Ce job ne fuzze pas, il vérifie seulement qu'elles
  # compilent encore — ~1 min, et le fuzzing planifié reste utilisable.
  # L'etabli (tools/lab : benchmark_db, ingestor, integration_test,
  # see_unparsable) est hors du workspace de la crate (#223) : ses
  # dependances ne passent plus par `cargo audit` ni par clippy. Ce job
  # verifie seulement qu'il compile encore contre la crate locale.
  lab:
    name: Lab tools still compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/lab -> target"

      - name: Check the lab workspace
        run: cargo check --manifest-path tools/lab/Cargo.toml --workspace --all-targets --all-features --locked

  fuzz-targets-build:
    name: Fuzz targets still compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      # `fuzz -> target` : le chemin est relatif au workspace `fuzz`
      # (`fuzz -> fuzz/target` mettait en cache fuzz/fuzz/target, #108).
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Chaque fichier de fuzz_targets/ a sa cible `[[bin]]` et inversement :
      # une cible oubliee dans fuzz/Cargo.toml ne compilerait ni ne tournerait
      # jamais, et la matrice nocturne est tiree de ces `[[bin]]` (#108).
      - name: Check every fuzz target is declared
        run: |
          declared=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "packet_parser-fuzz") | .targets[] | select(.kind | index("bin")) | .src_path' \
            | xargs -n1 basename | sort)
          present=$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sort)
          diff <(echo "$declared") <(echo "$present")

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      # Les oracles fixes du bloc `init` de chaque cible (politique FTP/SMTP/
      # NNTP hors port, COTP, Decode As dans policy_dispatch) tournent a
      # chaque PR : une politique modifiee sans son oracle echoue ici, pas la
      # nuit suivante (#108). `-runs=1` : le bloc init, puis une entree.
      - name: Run every fuzz target once
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -runs=1
          done
