name: Publish Crate

# Publishing is deliberate: it only happens for an explicit version tag
# (v1.2.3) or a manual dispatch — never as a side effect of CI/Coverage runs.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "packet_parser") | .version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      # Garde-fou de la fenetre de stabilite ouverte apres la 10.0.0 :
      # l'objectif est de tenir 6 a 12 mois sans rupture d'API, et une
      # rupture involontaire ne doit pas pouvoir atteindre crates.io.
      #
      # cargo-semver-checks compare l'API publique du tag a celle de la
      # derniere version publiee, et echoue si le changement exige un bump
      # plus fort que celui annonce par Cargo.toml. Une majeure deliberee
      # passe donc sans obstacle ; c'est la mineure ou la patch qui casse
      # sans le dire qui est arretee ici.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: Check API compatibility against the published version
        run: cargo semver-checks check-release

      - name: Publish crate
        run: cargo publish --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
